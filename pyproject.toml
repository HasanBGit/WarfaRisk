[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warfarisk"
version = "0.1.0"
description = "WarfaRisk: a nine-phase reproducible ML pipeline for warfarin dose prediction on the IWPC cohorts — leakage-free preprocessing, nested clinical/genetic ablation, ancestry-stratified fairness evaluation, conformal calibration, and SHAP explainability."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "shap",
    "openpyxl",
    "huggingface_hub",
]

[project.optional-dependencies]
phase1 = [
    "warfit-learn",
]
phase3 = [
    "xgboost",
    "catboost",
    "torch",
    "tabpfn",
    "autogluon.tabular[tabarena]",
]
phase5 = [
    "mapie>=1.4",
    "ngboost",
    "torch",
    "uncertainty-toolbox",
]
phase6 = [
    "interpret",
]
phase7 = [
    "d3rlpy",
    "torch",
]
phase7b = [
    "scikit-survival>=0.28",
    "pycox",
    "torch",
]
phase7c = [
    "hyperimpute",
]
phase7d = [
    "transformers",
    "torch",
    "huggingface_hub",
]
phase9 = [
    "sentence-transformers",
    "faiss-cpu",
    "transformers",
    "torch",
    "huggingface_hub",
]

[tool.hatch.build.targets.wheel]
packages = ["src/warfarisk"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
ignore = ["B905", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["warfarisk", "settings", "dosing_model", "explain_service"]

[tool.pytest.ini_options]
pythonpath = ["src", "prototype_app/server"]
testpaths = ["tests"]
